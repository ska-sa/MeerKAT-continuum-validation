[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "continuum-validation"
version = "0.1.0"
description = "Validation and quality assessment pipeline for radio continuum surveys"
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.scripts]
continuum-validate = "continuum_validation.Radio_continuum_validation:cli_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"continuum_validation.data" = ["*.txt"]
"continuum_validation.data.configs" = ["*.txt"]
